services:
  db:
    image: postgres:16
    container_name: branaye-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: branaye
      POSTGRES_PASSWORD: branaye
      POSTGRES_DB: branaye
    ports:
      - "5433:5432"
    volumes:
      - branaye-db-data:/var/lib/postgresql/data
volumes:
  branaye-db-data:
